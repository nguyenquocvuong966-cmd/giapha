<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gia phả họ Nguyễn</title>
<meta name="theme-color" content="#1F6B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap">
<style>
/* Bố cục: ứng dụng một cột cho điện thoại dọc; cây giãn toàn chiều ngang khi xoay ngang hoặc trên máy tính.
   Màu: giấy ngả xanh rêu, mực xanh ngọc làm điểm nhấn, mỗi chi một màu riêng. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface2:#E9EDE7; --ink:#18211E; --muted:#56635D; --faint:#86918C;
  --line:#D6DCD5; --line2:#B9C2BB; --accent:#1F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6; --accent-text:#17574A;
  --warn-bg:#FBEFD3; --warn-fg:#6B4A05; --danger:#B3261E; --danger-bg:#FBE4E1; --ok-bg:#DFF1E4; --ok-fg:#1E5B32;
  --scrim:rgba(16,22,20,.45); --shadow:0 10px 30px rgba(16,30,25,.18);
  --k0:#2F7D6B; --k0b:#DCEFE8; --k0f:#17493E;
  --k1:#B5532E; --k1b:#F7E1D6; --k1f:#6E2C14;
  --k2:#5B54B0; --k2b:#E5E3F7; --k2f:#2F2A73;
  --k3:#A07413; --k3b:#F5EACB; --k3f:#5E4306;
  --k4:#2E6FA8; --k4b:#DCE9F5; --k4f:#153F63;
  --k5:#A23E6B; --k5b:#F5DCE7; --k5f:#5E1F3C;
  --f-ui:"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-name:"Noto Serif", "Times New Roman", Georgia, serif;
  --r:12px; --hdr:56px; --tab:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A2320; --surface2:#222D29; --ink:#E6ECE8; --muted:#A3B0AA; --faint:#77847E;
  --line:#2E3A36; --line2:#45534D; --accent:#5DBFA5; --accent-ink:#0D1F1A; --accent-soft:#1D3A33; --accent-text:#8FDCC6;
  --warn-bg:#3A2E10; --warn-fg:#F2D48A; --danger:#F28B82; --danger-bg:#3D1C1A; --ok-bg:#163223; --ok-fg:#A7E3B8;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
  --k0:#5DCAA5; --k0b:#173A32; --k0f:#BDEBDA; --k1:#F0997B; --k1b:#4A2416; --k1f:#F5C4B3;
  --k2:#A9A2EE; --k2b:#2B2858; --k2f:#D8D5FA; --k3:#E3B04B; --k3b:#3D2E0B; --k3f:#F5DFA6;
  --k4:#85B7EB; --k4b:#132F4A; --k4f:#C9DEF5; --k5:#ED93B1; --k5b:#4A1A30; --k5f:#F4C0D1;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2320; --surface2:#222D29; --ink:#E6ECE8; --muted:#A3B0AA; --faint:#77847E;
  --line:#2E3A36; --line2:#45534D; --accent:#5DBFA5; --accent-ink:#0D1F1A; --accent-soft:#1D3A33; --accent-text:#8FDCC6;
  --warn-bg:#3A2E10; --warn-fg:#F2D48A; --danger:#F28B82; --danger-bg:#3D1C1A; --ok-bg:#163223; --ok-fg:#A7E3B8;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
  --k0:#5DCAA5; --k0b:#173A32; --k0f:#BDEBDA; --k1:#F0997B; --k1b:#4A2416; --k1f:#F5C4B3;
  --k2:#A9A2EE; --k2b:#2B2858; --k2f:#D8D5FA; --k3:#E3B04B; --k3b:#3D2E0B; --k3f:#F5DFA6;
  --k4:#85B7EB; --k4b:#132F4A; --k4f:#C9DEF5; --k5:#ED93B1; --k5b:#4A1A30; --k5f:#F4C0D1;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.k0{--k:var(--k0);--kb:var(--k0b);--kf:var(--k0f)} .k1{--k:var(--k1);--kb:var(--k1b);--kf:var(--k1f)}
.k2{--k:var(--k2);--kb:var(--k2b);--kf:var(--k2f)} .k3{--k:var(--k3);--kb:var(--k3b);--kf:var(--k3f)}
.k4{--k:var(--k4);--kb:var(--k4b);--kf:var(--k4f)} .k5{--k:var(--k5);--kb:var(--k5b);--kf:var(--k5f)}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Đầu trang & thanh tab */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{height:var(--hdr);display:flex;align-items:center;gap:6px;max-width:1200px;margin:0 auto}
.ttl{font-family:var(--f-name);font-weight:600;font-size:19px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.ib:hover{background:var(--surface2)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .tin{display:flex;max-width:640px;margin:0 auto;height:var(--tab)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{color:var(--accent-text)}
.tab[aria-current="true"] .ico{stroke-width:2.3}
main{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 20px)}
.wrap{max-width:640px;margin:0 auto;padding-block:14px}
.banner{font-size:14px;padding:8px 12px;border-radius:10px;margin:0 0 12px;background:var(--warn-bg);color:var(--warn-fg)}

/* Ảnh tròn */
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  border:calc(var(--s) * .06 + 1px) solid var(--k);background:var(--kb);color:var(--kf);font-weight:600;font-size:calc(var(--s) * .34)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Dạng 1 — gia đình */
.crumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{white-space:nowrap;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.crumb.on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent;font-weight:500}
.sec{font-size:13px;letter-spacing:.04em;color:var(--faint);margin:18px 2px 6px;font-weight:500;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:68px}
.row:hover{border-color:var(--line2)}
.row .nm{font-family:var(--f-name);font-weight:500;font-size:17px;line-height:1.3}
.row .sb{font-size:14px;color:var(--muted)}
.row .tx{flex:1;min-width:0}
.row .ico{color:var(--faint)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500;vertical-align:1px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 16px;text-align:center;margin-top:4px}
.hero .av{margin:0 auto 12px;cursor:zoom-in}
.hero h1{font-family:var(--f-name);font-weight:600;font-size:26px;line-height:1.25;margin:0 0 4px;text-wrap:balance}
.hero .meta{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line);font-size:16px}
.facts dt{color:var(--faint);font-size:14px;padding-top:2px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:16px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.add{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1.5px dashed var(--accent);border-radius:var(--r);color:var(--accent-text);font-weight:500;background:transparent;min-height:56px}
.add .pl{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* Dạng 4 — cây */
.tctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;max-width:1200px;margin:0 auto}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tctl .sp{flex:1}
.zb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.twrap{overflow:auto;border-top:1px solid var(--line);background:var(--bg);touch-action:pan-x pan-y;cursor:grab;overscroll-behavior:contain}
.twrap.drag{cursor:grabbing}
.tree{display:inline-block;min-width:100%;padding:24px 40px 60px;text-align:center}
.tree ul{display:flex;justify-content:center;padding:18px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:18px 5px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:18px;border-top:1.5px solid var(--line2)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line2)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--line2);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1.5px solid var(--line2)}
.tree>ul>li{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.nd{display:flex;flex-direction:column;align-items:center;gap:4px;width:118px;padding:10px 6px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--k)}
.nd .nm{font-family:var(--f-name);font-weight:500;font-size:14px;line-height:1.25}
.nd .yr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nd .sp{font-size:12px;color:var(--faint);line-height:1.25}
.nd.on{background:var(--accent-soft);border-color:var(--accent);border-top-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.nd.on .nm{color:var(--accent-text)}
.more{font-size:13px;padding:6px 12px;border-radius:999px;border:1px dashed var(--line2);color:var(--muted);background:var(--surface)}
.thint{font-size:13px;color:var(--faint)}

/* Dạng 5 — thanh thời gian */
.axis{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:5;background:var(--bg);height:30px;border-bottom:1px solid var(--line);margin-bottom:6px}
.axis span{position:absolute;bottom:4px;transform:translateX(-50%);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.axis span:first-child{transform:none}
.grid{position:relative}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);pointer-events:none}
.tl{position:relative;display:block;width:100%;height:34px;margin:3px 0;border-radius:8px}
.tl:hover{background:var(--surface2)}
.tb{position:absolute;top:5px;bottom:5px;border-radius:6px;background:var(--kb);border-left:3px solid var(--k);min-width:6px}
.tb.alive{border-right:2px dashed var(--k);border-radius:6px 0 0 6px}
.tlab{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 7px;font-size:13px;color:var(--kf);white-space:nowrap;font-weight:500}
.tl.on .tb{box-shadow:0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:4px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--kb);border-left:3px solid var(--k);vertical-align:-1px;margin-right:5px}

/* Ngày giỗ, quản trị */
.gio{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;text-align:left}
.gio .d{width:58px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.gio .d b{display:block;font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.gio .d small{font-size:12px;color:var(--faint)}
.soon{color:var(--accent-text);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.card span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.barrow{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.barrow .bt{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.barrow .bt i{display:block;height:100%;background:var(--k)}
.barrow b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--line2);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:25px}
.entry{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn-fg)}
.entry.off{background:var(--surface2);color:var(--muted)}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .tx{flex:1;min-width:150px}
.log{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log small{color:var(--faint);display:block;font-size:12px}

/* Lớp phủ, biểu mẫu */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-family:var(--f-name);font-size:21px;font-weight:600;margin:0 0 2px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld>span{font-size:14px;color:var(--muted)}
.inp{height:48px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--surface);font-size:17px;width:100%}
textarea.inp{height:auto;min-height:72px;padding:10px 12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);font-weight:500;cursor:pointer}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph .pv{width:84px;height:84px;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;overflow:hidden;color:var(--faint);flex:none}
.ph .pv img{width:100%;height:100%;object-fit:cover}
.ph .bts{display:flex;flex-wrap:wrap;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.err{color:var(--danger);background:var(--danger-bg);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.more-f summary{cursor:pointer;color:var(--accent-text);font-weight:500;padding:6px 0 10px}
.menu .mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.menu .mi:last-child{border-bottom:0}
.who{font-size:14px;color:var(--muted);margin-bottom:6px}
.srch{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.big{max-width:min(92vw,520px);border-radius:16px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* Đăng nhập */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:24px}
.lbox{width:100%;max-width:400px}
.seal{width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-name);font-size:30px;font-weight:600;margin-bottom:16px}
.lbox h1{font-family:var(--f-name);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.lbox p{color:var(--muted);margin:0 0 20px}
.demo{margin-top:22px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px}
.demo b{font-weight:600}
.demo button{display:flex;justify-content:space-between;width:100%;padding:8px 0;border-top:1px solid var(--line);text-align:left}
.demo button:first-of-type{border-top:0}

<body>

<script>
/* ================= CẤU HÌNH =================
   API_URL để trống = chạy thử với dữ liệu mẫu trong máy.
   Dán link Apps Script (/exec) vào đây để dùng dữ liệu thật. */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbwKWNfHVk_fH6wH44f3O-ZhwfhQ17-jSDgwqGB54-So75Hv4UuFHjZuwotfa9M3DJb3uw/exec', TEN: 'Gia phả họ Nguyễn' };

const DEMO = !CONFIG.API_URL;
const NOW = new Date();
const NOW_Y = NOW.getFullYear();
const S = { token:null, me:null, people:{}, list:[], kids:{}, chis:[], entryMode:true, title:CONFIG.TEN, calView:'list', calY:NOW.getFullYear(), calM:NOW.getMonth() + 1, calSel:null, calRange:3, hist:[], opts:{ sinhNhat:false }, hform:null,
  focus:null, view:'family', autoTree:false, treeMode:'quanh', zoom:1, overlay:null, form:null,
  offline:false, users:null, logs:null, photos:{}, asked:{}, resetFor:null };

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const num = (v, d = 0) => { const n = parseInt(v, 10); return isNaN(n) ? d : n; };
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  fam:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .3 5.5 2.7 5.5 5.8"/>',
  tree:'<rect x="9" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="16" width="6" height="5" rx="1.2"/><rect x="15" y="16" width="6" height="5" rx="1.2"/><path d="M12 8v4M6 16v-4h12v4"/>',
  time:'<path d="M4 6h10M7 12h12M4 18h8"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',
  out:'<path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/>',
  zin:'<circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/>',
  zout:'<circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  gio:'<path d="M12 21v-7"/><path d="M12 14c-3 0-5-2-5-5 3 0 5 2 5 5zM12 14c3 0 5-2 5-5-3 0-5 2-5 5z"/><path d="M12 9V3"/>',
  cake:'<path d="M4 21h16M5 21v-7h14v7"/><path d="M5 17c2 1 3-1 5-1s3 2 5 1 3-1 4-1"/><path d="M12 14v-4M12 7v-.5"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  left:'<path d="m15 6-6 6 6 6"/>'
};
const ic = (n, s = 22) => `<svg class="ico" viewBox="0 0 24 24" style="width:${s}px;height:${s}px" aria-hidden="true">${I[n]}</svg>`;

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- âm lịch (thuật toán Hồ Ngọc Đức, múi giờ +7) ---------- */
const LUNAR = (() => {
  const INT = Math.floor, PI = Math.PI, TZ = 7;
  function jdFromDate(dd, mm, yy){ const a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
    let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
    if (jd < 2299161) jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083; return jd; }
  function jdToDate(jd){ let a, b, c; if (jd > 2299160){ a = jd + 32044; b = INT((4 * a + 3) / 146097); c = a - INT((b * 146097) / 4); } else { b = 0; c = jd + 32082; }
    const d = INT((4 * c + 3) / 1461), e = c - INT((1461 * d) / 4), m = INT((5 * e + 2) / 153);
    return [e - INT((153 * m + 2) / 5) + 1, m + 3 - 12 * INT(m / 10), b * 100 + d - 4800 + INT(m / 10)]; }
  function newMoon(k){ const T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
    let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
    C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
    C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr);
    C1 = C1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
    C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
    C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
    C1 = C1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    const deltat = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return Jd1 + C1 - deltat; }
  function sunLong(jdn){ const T = (jdn - 2451545.0) / 36525, T2 = T * T, dr = PI / 180;
    const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    let L = (L0 + DL) * dr; L -= PI * 2 * INT(L / (PI * 2)); return L; }
  const getSun = dn => INT(sunLong(dn - 0.5 - TZ / 24) / PI * 6);
  const getNM = k => INT(newMoon(k) + 0.5 + TZ / 24);
  function m11(yy){ const off = jdFromDate(31, 12, yy) - 2415021, k = INT(off / 29.530588853); let nm = getNM(k); if (getSun(nm) >= 9) nm = getNM(k - 1); return nm; }
  function leapOff(a11){ const k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5); let last, i = 1, arc = getSun(getNM(k + i));
    do { last = arc; i++; arc = getSun(getNM(k + i)); } while (arc != last && i < 14); return i - 1; }
  function s2l(dd, mm, yy){ const dn = jdFromDate(dd, mm, yy), k = INT((dn - 2415021.076998695) / 29.530588853);
    let ms = getNM(k + 1); if (ms > dn) ms = getNM(k);
    let a11 = m11(yy), b11 = a11, ly; if (a11 >= ms){ ly = yy; a11 = m11(yy - 1); } else { ly = yy + 1; b11 = m11(yy + 1); }
    const ld = dn - ms + 1, diff = INT((ms - a11) / 29); let leap = 0, lm = diff + 11;
    if (b11 - a11 > 365){ const lo = leapOff(a11); if (diff >= lo){ lm = diff + 10; if (diff == lo) leap = 1; } }
    if (lm > 12) lm -= 12; if (lm >= 11 && diff < 4) ly -= 1; return [ld, lm, ly, leap]; }
  function l2s(ld, lm, ly, leap){ let a11, b11; if (lm < 11){ a11 = m11(ly - 1); b11 = m11(ly); } else { a11 = m11(ly); b11 = m11(ly + 1); }
    const k = INT(0.5 + (a11 - 2415021.076998695) / 29.530588853); let off = lm - 11; if (off < 0) off += 12;
    if (b11 - a11 > 365){ const lo = leapOff(a11); let lmo = lo - 2; if (lmo < 0) lmo += 12;
      if (leap != 0 && lm != lmo) return null; else if (leap != 0 || off >= lo) off += 1; }
    const ms = getNM(k + off); const nextMs = getNM(k + off + 1);
    const day = Math.min(ms + ld - 1, nextMs - 1); return jdToDate(day); }
  const CAN = ['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
  const CHI = ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
  const canChi = y => CAN[(y + 6) % 10] + ' ' + CHI[(y + 8) % 12];
  return { s2l, l2s, canChi, jdFromDate };
})();

/* ---------- chỉ mục dữ liệu ---------- */
const P = id => S.people[id];
function reindex(arr){
  S.list = arr; S.people = {}; S.kids = {};
  arr.forEach(p => S.people[p.id] = p);
  arr.forEach(p => [p.chaId, p.meId].forEach(pid => { if (pid && S.people[pid]){ (S.kids[pid] = S.kids[pid] || []); if (!S.kids[pid].includes(p.id)) S.kids[pid].push(p.id); } }));
  for (const k in S.kids) S.kids[k].sort(byBirth);
  S.chis = [...new Set(arr.map(p => p.chi).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi', { numeric:true }));
  computeDoi(); EVC = null;
}
function byBirth(a, b){ const A = P(a), B = P(b);
  return (num(A.thuTu, 99) - num(B.thuTu, 99)) || (num(A.namSinh, 9999) - num(B.namSinh, 9999)) || A.hoTen.localeCompare(B.hoTen, 'vi'); }
const kidsOf = id => (S.kids[id] || []).map(P);
const spouses = p => String(p.voChong || '').split(',').filter(Boolean).map(P).filter(Boolean);
const parents = p => [P(p.chaId), P(p.meId)].filter(Boolean);
function siblings(p){ const ids = new Set(); [p.chaId, p.meId].forEach(pid => (S.kids[pid] || []).forEach(id => { if (id !== p.id) ids.add(id); }));
  return [...ids].sort(byBirth).map(P); }
function clanParent(p){ const c = P(p.chaId), m = P(p.meId);
  if (c && !c.ngoaiToc) return c; if (m && !m.ngoaiToc) return m; return c || m || null; }
// Đời tự tính theo cha mẹ: thêm người ở đời trên thì cả họ tự lùi xuống
function computeDoi(){ const memo = {};
  const f = (p, g) => { if (memo[p.id] != null) return memo[p.id]; if (g > 80) return num(p.doi, 1);
    const cp = clanParent(p); let d;
    if (cp) d = f(cp, g + 1) + 1;
    else if (p.ngoaiToc){ const sp = spouses(p).find(x => !x.ngoaiToc); d = sp ? f(sp, g + 1) : num(p.doi, 1); }
    else d = Math.max(1, num(p.doi, 1));
    return memo[p.id] = d; };
  S.list.forEach(p => p._doi = f(p, 0)); }
function lineOf(p){ const out = []; let cur = p, guard = 0;
  if (cur.ngoaiToc && !clanParent(cur)){ const sp = spouses(cur).find(s => !s.ngoaiToc); if (sp) cur = sp; }
  while (cur && guard++ < 40){ out.unshift(cur); cur = clanParent(cur); } return out; }
const chiIdx = chi => Math.max(0, S.chis.indexOf(chi)) % 6;
const chiName = chi => chi || 'Dòng chính';
function initials(n){ const w = String(n || '').trim().split(/\s+/).filter(Boolean); if (!w.length) return '?';
  return (w.length > 1 ? w[w.length - 2][0] + w[w.length - 1][0] : w[0][0]).toUpperCase(); }
function years(p){ const a = p.namSinh || '?'; return p.conSong ? (p.namSinh ? 'Sinh ' + a : '') : a + ' – ' + (p.namMat || '?'); }
function age(p){ const s = num(p.namSinh, 0); if (!s) return ''; const e = p.conSong ? NOW_Y : num(p.namMat, 0); return e ? (e - s) + ' tuổi' : ''; }
function av(p, size){ const src = p.anhId && S.photos[p.anhId];
  return `<span class="av k${chiIdx(p.chi)}" style="--s:${size}px"${!src && p.anhId ? ` data-ph="${esc(p.anhId)}"` : ''}>${src ? `<img src="${src}" alt="">` : `<span>${esc(initials(p.hoTen))}</span>`}</span>`; }
const isAdmin = () => S.me && S.me.vaiTro === 'admin';
function canEditChi(chi){ if (!S.me) return false; if (isAdmin()) return true;
  return S.me.vaiTro === 'bientap' && S.entryMode && String(chi || '') === String(S.me.chi || ''); }
const canEdit = p => p && canEditChi(p.chi);

/* ---------- ảnh: tải dần, lưu trong máy ---------- */
const IDB = {
  db:null,
  open(){ return new Promise(r => { try { const q = indexedDB.open('giapha', 1); q.onupgradeneeded = () => q.result.createObjectStore('anh');
    q.onsuccess = () => { this.db = q.result; r(); }; q.onerror = () => r(); } catch(e){ r(); } }); },
  get(k){ return new Promise(r => { try { const q = this.db.transaction('anh').objectStore('anh').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); } catch(e){ r(null); } }); },
  set(k, v){ try { this.db.transaction('anh', 'readwrite').objectStore('anh').put(v, k); } catch(e){} }

// Chỉ tải ảnh của người đang hiện trên màn hình, mỗi lần 10 ảnh, và gắn thẳng vào chỗ, không vẽ lại cả trang
let phBusy = false;
async function loadPhotos(){
  if (phBusy) return; phBusy = true;
  try {
    const els = [...document.querySelectorAll('[data-ph]')].slice(0, 120);
    const need = [...new Set(els.map(e => e.dataset.ph))].filter(id => !S.photos[id] && !S.asked[id]);
    const fill = id => document.querySelectorAll(`[data-ph="${CSS.escape(id)}"]`).forEach(el => { el.innerHTML = `<img src="${S.photos[id]}" alt="">`; el.removeAttribute('data-ph'); });
    Object.keys(S.photos).forEach(id => { if (document.querySelector(`[data-ph="${CSS.escape(id)}"]`)) fill(id); });
    if (!need.length) return;
    need.forEach(id => S.asked[id] = 1);
    if (IDB.db) for (const id of need){ const v = await IDB.get(id); if (v){ S.photos[id] = v; fill(id); } }
    const rest = need.filter(id => !S.photos[id]);
    for (let i = 0; i < rest.length; i += 10){
      const part = rest.slice(i, i + 10);
      try { const r = await api('photo', { ids: part });
        Object.entries(r.photos || {}).forEach(([k, v]) => { if (v){ S.photos[k] = v; IDB.set(k, v); fill(k); } }); }
      catch(e){ part.forEach(id => delete S.asked[id]); break; }
    }
  } finally { phBusy = false; }
}
function readPhoto(file){ return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 400;
    const sx = (img.width - s) / 2, sy = img.height > img.width ? (img.height - s) * 0.3 : (img.height - s) / 2;
    c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, 400, 400); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh này')); }; img.src = url; }); }

/* Dạng 1 */
function familyHTML(){

  const facts = [];
  if (p.ngaySinh || p.namSinh) facts.push(['Sinh', esc(p.ngaySinh || p.namSinh)]);
  if (!p.conSong) facts.push(['Mất', esc(p.namMat || 'Chưa rõ năm')]);

  const meta = [`Đời ${p._doi}`, esc(chiName(p.chi))]; if (p.ngoaiToc) meta.push(p.gioiTinh === 'nu' ? 'Dâu' : 'Rể');
  const a = age(p); if (a) meta.push(a);
  const pars = parents(p), sps = spouses(p), kids = kidsOf(p.id), sibs = siblings(p);

  if (sps.length) h += `<div class="sec">${p.gioiTinh === 'nu' ? 'Chồng' : 'Vợ'}</div><div class="list">${sps.map(x => rowHTML(x, subLine(x))).join('')}</div>`;
  if (kids.length) h += `<div class="sec">Các con (${kids.length})</div><div class="list">${kids.map(x => rowHTML(x, subLine(x, kidsOf(x.id).length ? kidsOf(x.id).length + ' con' : ''))).join('')}</div>`;

}
function shortName(p){ const w = p.hoTen.trim().split(/\s+/); const t = w[w.length - 1] || p.hoTen;
  if (p._doi === 1 && !p.ngoaiToc) return 'Cụ ' + t; return t; }

/* Dạng 4 */
function treeRoots(){
  if (S.treeMode === 'toan') return S.list.filter(p => !p.ngoaiToc && !clanParent(p)).sort((a, b) => a._doi - b._doi || byBirth(a.id, b.id));
  let p = P(S.focus); if (!p) return [];
  if (p.ngoaiToc && !clanParent(p)){ const sp = spouses(p).find(s => !s.ngoaiToc); if (sp) p = sp; }
  let r = p; for (let i = 0; i < 2; i++){ const c = clanParent(r); if (c) r = c; }
  return [r];
}
function countDesc(id, seen = new Set()){ let n = 0; kidsOf(id).forEach(k => { if (!seen.has(k.id)){ seen.add(k.id); n += 1 + countDesc(k.id, seen); } }); return n; }
function treeHTML(){
  const roots = treeRoots(), seen = new Set(), maxD = S.treeMode === 'toan' ? 99 : 4;
  const sp = p => { const s = spouses(p); return s.length ? `<span class="sp">& ${s.map(x => esc(shortName(x))).join(', ')}</span>` : ''; };
  function li(p, d){
    if (seen.has(p.id)) return ''; seen.add(p.id);
    const kids = kidsOf(p.id).filter(k => !seen.has(k.id));
    let ch = '';
    if (kids.length){ ch = d >= maxD ? `<ul><li><button class="more" data-act="tfocus" data-id="${kids[0].id}">+ ${countDesc(p.id)} người</button></li></ul>` : `<ul>${kids.map(k => li(k, d + 1)).join('')}</ul>`; }
    return `<li><button class="nd k${chiIdx(p.chi)}${p.id === S.focus ? ' on' : ''}" data-act="tfocus" data-id="${p.id}">${av(p, 40)}<span class="nm">${esc(p.hoTen)}</span><span class="yr">${esc(years(p).replace('Sinh ', ''))}</span>${sp(p)}</button>${ch}</li>`;

    <p class="thint">Bấm vào một người để chọn, bấm lần nữa để mở hồ sơ.</p></div></div>`;
}
function treeZoom(){ return S.zoomUser ? S.zoom : (isPhone() && isLand() ? 0.72 : 1); }
function sizeTree(){ const w = $('#twrap'); if (!w) return;
  const tabH = ($('.tabs') || {}).offsetHeight || 62; w.style.height = Math.max(260, innerHeight - w.getBoundingClientRect().top - tabH) + 'px'; }
function centerTree(){ const w = $('#twrap'), el = w && w.querySelector('.nd.on'); if (!el) return;
  const wr = w.getBoundingClientRect(), r = el.getBoundingClientRect();
  w.scrollLeft += (r.left + r.width / 2) - (wr.left + wr.width / 2); w.scrollTop += (r.top + r.height / 2) - (wr.top + wr.height / 3); }
let TD = null, TDW = null;
addEventListener('pointermove', e => { if (!TD || !TDW) return; const dx = e.clientX - TD.x, dy = e.clientY - TD.y;
  if (Math.abs(dx) + Math.abs(dy) > 5){ TD.moved = true; TDW.classList.add('drag'); } if (TD.moved){ TDW.scrollLeft = TD.l - dx; TDW.scrollTop = TD.t - dy; } });
addEventListener('pointerup', () => { if (TD && TD.moved && TDW){ TDW.dataset.dragged = '1'; const w = TDW; setTimeout(() => delete w.dataset.dragged, 50); } TD = null; if (TDW) TDW.classList.remove('drag'); });

}

/* Dạng 5 */
function timeHTML(){
  const ppl = S.list.filter(p => num(p.namSinh, 0) > 0).sort((a, b) => num(a.namSinh) - num(b.namSinh) || byBirth(a.id, b.id));
  const unknown = S.list.length - ppl.length;
  if (!ppl.length) return `<div class="wrap gut"><div class="empty">Chưa có ai được nhập năm sinh.</div></div>`;
  const y0 = Math.floor(num(ppl[0].namSinh) / 10) * 10, y1 = NOW_Y + 2, span = y1 - y0;
  const step = span > 130 ? 25 : span > 70 ? 20 : 10;
  const pos = y => ((y - y0) / span * 100);
  const ticks = []; for (let y = y0; y <= NOW_Y; y += step) ticks.push(y);
  const used = [...new Set(ppl.map(p => p.chi))];
  let h = `<div class="wrap gut">${banners()}<div class="legend">${used.map(c => `<span class="k${chiIdx(c)}"><i></i>${esc(chiName(c))}</span>`).join('')}<span>Viền đứt: còn sống</span></div>
    <div class="axis">${ticks.map(y => `<span style="left:${pos(y)}%">${y}</span>`).join('')}</div><div class="grid">${ticks.map(y => `<span class="gl" style="left:${pos(y)}%"></span>`).join('')}`;
  ppl.forEach(p => {
    const s = num(p.namSinh), e = p.conSong ? NOW_Y : num(p.namMat, 0);
    const l = pos(s), w = e ? Math.max(1.2, pos(e) - l) : 3;
    const lab = `${esc(p.hoTen.split(/\s+/).slice(-2).join(' '))}${age(p) ? ' · ' + age(p).replace(' tuổi', '') : ''}`;
    const labPos = l > 52 ? `right:${Math.max(0, 100 - l - w)}%` : `left:${l}%`;
    h += `<button class="tl k${chiIdx(p.chi)}${p.id === S.focus ? ' on' : ''}" data-act="lfocus" data-id="${p.id}" aria-label="${esc(p.hoTen)}, ${esc(years(p))}">
      <span class="tb${p.conSong ? ' alive' : ''}" style="left:${l}%;width:${w}%"></span><span class="tlab" style="${labPos}">${lab}</span></button>`;
  });
  h += `</div>`;
  if (unknown) h += `<p class="thint" style="margin-top:12px">${unknown} người chưa có năm sinh nên chưa hiện trên thanh thời gian.</p>`;
  return h + `</div>`;
}
function afterTime(keep){ if (keep) return; const el = document.querySelector('.tl.on'); if (el) el.scrollIntoView({ block:'center' }); }

/* Lịch: giỗ theo âm lịch, sinh nhật theo dương lịch */
const THU2 = ['CN','T2','T3','T4','T5','T6','T7'];
const THU = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const jdOf = (d, m, y) => LUNAR.jdFromDate(d, m, y);
const TODAY_J = jdOf(NOW.getDate(), NOW.getMonth() + 1, NOW_Y);
let EVC = null;
function xung(p){ if (p._doi === 1) return p.gioiTinh === 'nu' ? 'cụ bà' : 'cụ'; return p.gioiTinh === 'nu' ? 'bà' : 'ông'; }
function events(){
  if (EVC) return EVC;
  const out = [], ly = LUNAR.s2l(NOW.getDate(), NOW.getMonth() + 1, NOW_Y)[2], dm = /^\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/;
  S.list.forEach(p => {
    if (!p.conSong){ const m = String(p.ngayGio || '').match(dm); if (!m) return; const d = +m[1], mo = +m[2]; if (d < 1 || d > 30 || mo < 1 || mo > 12) return;
      for (const y of [ly - 1, ly, ly + 1]){ const s = LUNAR.l2s(d, mo, y, 0); if (!s) continue;
        out.push({ k:'gio', p, j:jdOf(s[0], s[1], s[2]), d:s[0], m:s[1], y:s[2], t1:'Giỗ ' + xung(p) + ' ' + p.hoTen, t2:d + '/' + mo + ' âm' + (p.namMat ? ' · mất ' + p.namMat : '') }); }
    } else { const m = String(p.ngaySinh || p.sinhNhat || '').match(dm); if (!m) return; const d = +m[1], mo = +m[2]; if (d < 1 || d > 31 || mo < 1 || mo > 12) return;
      const by = num(p.namSinh, 0);
      for (const y of [NOW_Y - 1, NOW_Y, NOW_Y + 1]){ const dd = Math.min(d, new Date(y, mo, 0).getDate());
        out.push({ k:'sn', p, j:jdOf(dd, mo, y), d:dd, m:mo, y, t1:'Sinh nhật ' + p.hoTen, t2: by ? 'Tròn ' + (y - by) + ' tuổi · sinh ' + by : '' }); } }
  });
  return EVC = out.sort((a, b) => a.j - b.j || a.k.localeCompare(b.k));
}
function evRow(e){ const left = e.j - TODAY_J;
  const cd = left < 0 ? 'Đã qua' : left === 0 ? 'Hôm nay' : left === 1 ? 'Ngày mai' : left + ' ngày';
  return `<button class="ev ${e.k}${left < 0 ? ' past' : ''}" data-act="focus" data-id="${e.p.id}"><span class="dd"><b>${e.d}/${e.m}</b><small>${THU2[new Date(e.y, e.m - 1, e.d).getDay()]}</small></span>
    <span class="ic">${ic(e.k === 'gio' ? 'gio' : 'cake', 18)}</span><span class="tx"><span class="t1">${esc(e.t1)}</span>${e.t2 ? `<span class="t2">${esc(e.t2)}</span>` : ''}</span>
    <span class="cd${left >= 0 && left <= 7 ? ' soon' : ''}">${cd}</span></button>`; }
function calHTML(){
  const tl = LUNAR.s2l(NOW.getDate(), NOW.getMonth() + 1, NOW_Y), ev = events();
  let h = `<div class="wrap gut">${banners()}<div class="seg2" role="group" aria-label="Kiểu xem lịch"><button data-act="calv" data-v="list" aria-pressed="${S.calView === 'list'}">Danh sách</button><button data-act="calv" data-v="month" aria-pressed="${S.calView === 'month'}">Tháng</button></div>
    <div class="today"><b>Hôm nay, ${THU2[NOW.getDay()]} ${NOW.getDate()}/${NOW.getMonth() + 1}/${NOW_Y}</b><span>${tl[0]}/${tl[1]} âm · năm ${LUNAR.canChi(tl[2])}</span></div>`;
  const hint = S.me.vaiTro === 'xem' && !S.opts.sinhNhat ? `<p class="thint" style="margin-top:14px">Sinh nhật của người còn sống chỉ hiện với người nhập liệu và quản trị.</p>` : '';
  if (!ev.length) return h + `<div class="empty">Chưa có ngày giỗ hay ngày sinh nào được nhập.</div>${hint}</div>`;
  if (S.calView === 'list'){
    let ey = NOW_Y, em = NOW.getMonth() + 1 + S.calRange; while (em > 12){ em -= 12; ey++; }
    const endJ = jdOf(1, em, ey), items = ev.filter(e => e.j >= TODAY_J - 3 && e.j < endJ);
    let cur = '';
    items.forEach(e => { const key = e.m + '/' + e.y; if (key !== cur){ cur = key; const n = items.filter(x => x.m === e.m && x.y === e.y);
      const g = n.filter(x => x.k === 'gio').length, sn = n.length - g;
      h += `<div class="mh"><h3>Tháng ${e.m}/${e.y}</h3><span>${[g ? g + ' giỗ' : '', sn ? sn + ' sinh nhật' : ''].filter(Boolean).join(' · ')}</span></div>`; }
      h += evRow(e); });
    if (!items.length) h += `<div class="empty">Không có ngày giỗ hay sinh nhật nào trong ${S.calRange} tháng tới.</div>`;
    if (ev.some(e => e.j >= endJ) && S.calRange < 12) h += `<button class="btn" data-act="calmore" style="width:100%;margin-top:6px">Xem thêm 3 tháng</button>`;
    return h + hint + `</div>`;
  }
  const y = S.calY, m = S.calM, nd = new Date(y, m, 0).getDate(), first = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const a = LUNAR.s2l(1, m, y), z = LUNAR.s2l(nd, m, y);
  h += `<div class="mnav"><button class="ib" data-act="calnav" data-z="-1" aria-label="Tháng trước">${ic('left')}</button><h3>Tháng ${m}/${y}<small>từ ${a[0]}/${a[1]} đến ${z[0]}/${z[1]} âm lịch</small></h3><button class="ib" data-act="calnav" data-z="1" aria-label="Tháng sau">${ic('chev')}</button></div><div class="cal">`;
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(d => h += `<div class="h">${d}</div>`);
  for (let i = 0; i < first; i++) h += '<div class="c o"></div>';
  const inM = ev.filter(e => e.m === m && e.y === y);
  for (let d = 1; d <= nd; d++){ const l = LUNAR.s2l(d, m, y), es = inM.filter(e => e.d === d);
    h += `<button class="c${jdOf(d, m, y) === TODAY_J ? ' td' : ''}" data-act="calday" data-d="${d}" aria-pressed="${S.calSel === d}"><b>${d}</b><small>${l[0] === 1 ? '1/' + l[1] : l[0]}</small><span class="dots">${es.slice(0, 3).map(e => `<i class="${e.k === 'gio' ? 'dg' : 'ds'}"></i>`).join('')}</span></button>`; }
  h += `</div><div class="lg"><span class="dg"><i></i>Ngày giỗ (theo âm lịch)</span><span class="ds"><i></i>Sinh nhật (theo dương lịch)</span></div>`;
  const list = S.calSel ? inM.filter(e => e.d === S.calSel) : inM;
  if (S.calSel){ const l = LUNAR.s2l(S.calSel, m, y); h += `<div class="mh"><h3>${THU[new Date(y, m - 1, S.calSel).getDay()]} ${S.calSel}/${m}</h3><span>${l[0]}/${l[1]} âm lịch</span></div>`; }
  else h += `<div class="mh"><h3>Trong tháng ${m}</h3><span>${list.length ? list.length + ' ngày cần nhớ' : ''}</span></div>`;
  h += list.length ? list.map(evRow).join('') : `<p class="thint">Không có giỗ hay sinh nhật.</p>`;
  return h + hint + `</div>`;
}

/* Lịch sử dòng họ: ai cũng đọc được, chỉ quản trị sửa */
function yearKey(x){ const m = String(x.thoiGian || '').match(/\d{3,4}/); return m ? +m[0] : 99999; }
function paras(t){ return String(t || '').split(/\n\s*\n/).map(b => `<p>${esc(b).replace(/\n/g, '<br>')}</p>`).join(''); }
function histHTML(){

/* Công cụ quản trị: tệp GEDCOM, in phả đồ */
function gedcom(){
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const gd = (full, yr) => { const m = String(full || '').match(/^\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{3,4})\s*$/); if (m && +m[2] >= 1 && +m[2] <= 12) return (+m[1]) + ' ' + MON[+m[2] - 1] + ' ' + m[3]; return /^\d{3,4}$/.test(yr || '') ? yr : ''; };
  const one = t => String(t || '').replace(/[\r\n]+/g, ' ').trim();
  const L = ['0 HEAD','1 SOUR GIAPHA','1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 SUBM @U1@','0 @U1@ SUBM','1 NAME ' + one(S.me.hoTen || S.me.u)];
  const ix = {}; S.list.forEach((p, i) => ix[p.id] = '@I' + (i + 1) + '@');
  const fams = {}, key = (h, w) => (h || '') + '|' + (w || '');
  S.list.forEach(p => { if (p.chaId || p.meId){ const k = key(p.chaId, p.meId); (fams[k] = fams[k] || { h:p.chaId, w:p.meId, c:[] }).c.push(p.id); } });
  S.list.forEach(p => spouses(p).forEach(s => { const h = p.gioiTinh === 'nu' ? s.id : p.id, w = p.gioiTinh === 'nu' ? p.id : s.id, k = key(h, w); if (!fams[k]) fams[k] = { h, w, c:[] }; }));
  const fid = {}; Object.keys(fams).forEach((k, i) => fid[k] = '@F' + (i + 1) + '@');
  S.list.forEach(p => { const w = one(p.hoTen).split(/\s+/), sur = w.length > 1 ? w[0] : '', giv = w.length > 1 ? w.slice(1).join(' ') : w[0];
    L.push('0 ' + ix[p.id] + ' INDI', '1 NAME ' + giv + ' /' + sur + '/'); if (sur) L.push('2 SURN ' + sur); L.push('2 GIVN ' + giv, '1 SEX ' + (p.gioiTinh === 'nu' ? 'F' : 'M'));
    const b = gd(p.ngaySinh, p.namSinh); if (b) L.push('1 BIRT', '2 DATE ' + b);
    if (!p.conSong){ L.push('1 DEAT' + (p.namMat ? '' : ' Y')); if (p.namMat) L.push('2 DATE ' + p.namMat); }
    if (p.anTang) L.push('1 BURI', '2 PLAC ' + one(p.anTang));
    const n = ['Đời thứ ' + p._doi]; if (p.chi) n.push(p.chi); if (p.tenHuy) n.push('Tên húy: ' + p.tenHuy); if (p.ngayGio) n.push('Ngày giỗ âm lịch: ' + p.ngayGio);
    if (p.ghiChu) n.push(p.ghiChu); if (p.nguon) n.push('Nguồn: ' + p.nguon); L.push('1 NOTE ' + one(n.join('; ')));
    Object.keys(fams).forEach(k => { const f = fams[k]; if (f.c.includes(p.id)) L.push('1 FAMC ' + fid[k]); if (f.h === p.id || f.w === p.id) L.push('1 FAMS ' + fid[k]); }); });
  Object.keys(fams).forEach(k => { const f = fams[k]; L.push('0 ' + fid[k] + ' FAM'); if (f.h && ix[f.h]) L.push('1 HUSB ' + ix[f.h]); if (f.w && ix[f.w]) L.push('1 WIFE ' + ix[f.w]); f.c.forEach(c => L.push('1 CHIL ' + ix[c])); });
  L.push('0 TRLR'); return L.join('\r\n') + '\r\n';
}
function saveFile(name, text){
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'text/plain;charset=utf-8' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Đã tạo tệp ' + name); }
  catch(e){ toast('Trình duyệt này không tải tệp được'); }
}

function formHTML(){
  const { mode, rel, d } = S.form, base = P(S.form.of);
  const title = mode === 'edit' ? 'Sửa thông tin' : { con:'Thêm con', vo: base && base.gioiTinh === 'nu' ? 'Thêm chồng' : 'Thêm vợ', anhem:'Thêm anh chị em', cha:'Thêm cha', root:'Nhập thủy tổ' }[rel];
  const sub = mode === 'edit' ? esc(d.hoTen) : rel === 'con' ? `Con của ${esc(base.hoTen)} · Đời ${esc(d.doi)}` : rel === 'vo' ? `Của ${esc(base.hoTen)} · Đời ${esc(d.doi)}` : rel === 'anhem' ? `Anh chị em của ${esc(base.hoTen)}` : rel === 'cha' ? `Cha của ${esc(base.hoTen)}` : 'Người đứng đầu gia phả';
  const cur = S.form.photo || (d.anhId && S.photos[d.anhId]);
  const radio = (name, val, label, on) => `<label class="chip"><input type="radio" name="${name}" value="${val}"${on ? ' checked' : ''}><span>${label}</span></label>`;
  let mother = '';
  if (rel === 'con' && base){ const sps = spouses(base); if (sps.length > 1){ const k = base.gioiTinh === 'nu' ? 'chaId' : 'meId';
    mother = `<label class="fld"><span>${base.gioiTinh === 'nu' ? 'Cha là' : 'Mẹ là'}</span><select class="inp" id="f_other">${sps.map(s => `<option value="${s.id}"${d[k] === s.id ? ' selected' : ''}>${esc(s.hoTen)}</option>`).join('')}</select></label>`; } }
  return `<form data-form="person" novalidate><h2>${title}</h2><p class="sub">${sub}</p>${S.form.err ? `<div class="err">${esc(S.form.err)}</div>` : ''}
    <div class="ph"><span class="pv" id="pv">${cur ? `<img src="${cur}" alt="">` : ic('cam', 28)}</span><span class="bts">
      <span class="btn sm filebtn">${ic('cam', 18)}Chụp ảnh<input type="file" accept="image/*" capture="environment" data-photo aria-label="Chụp ảnh"></span>
      <span class="btn sm filebtn">${ic('img', 18)}Chọn ảnh<input type="file" accept="image/*" data-photo aria-label="Chọn ảnh từ máy"></span>
      <span class="thint" style="width:100%">Ảnh tự cắt vuông và thu nhỏ.</span></span></div>
    <label class="fld"><span>Họ và tên</span><input class="inp" id="f_hoTen" value="${esc(d.hoTen === 'Khuyết danh' ? '' : d.hoTen)}" placeholder="Nguyễn Văn ..." autocomplete="off"${d.hoTen === 'Khuyết danh' ? ' disabled' : ''}></label>
    <label class="kd"><input type="checkbox" id="f_kd"${d.hoTen === 'Khuyết danh' ? ' checked' : ''}>Chưa rõ tên (ghi là khuyết danh)</label>
    <div class="fld"><span>Giới tính</span><div class="chips">${radio('gt', 'nam', 'Nam', d.gioiTinh !== 'nu')}${radio('gt', 'nu', 'Nữ', d.gioiTinh === 'nu')}</div></div>
    ${mother}
    <div class="two"><label class="fld"><span>Năm sinh</span><input class="inp" id="f_namSinh" inputmode="numeric" value="${esc(d.namSinh)}" placeholder="1985"></label>
    <label class="fld"><span>Con thứ</span><input class="inp" id="f_thuTu" inputmode="numeric" value="${esc(d.thuTu)}" placeholder="1"></label></div>
    <div class="fld"><span>Còn sống?</span><div class="chips">${radio('cs', '1', 'Còn sống', d.conSong)}${radio('cs', '0', 'Đã mất', !d.conSong)}</div></div>
    <div id="deadF" ${d.conSong ? 'hidden' : ''}><div class="two"><label class="fld"><span>Năm mất</span><input class="inp" id="f_namMat" inputmode="numeric" value="${esc(d.namMat)}" placeholder="1998"></label>
      <label class="fld"><span>Ngày giỗ (âm lịch)</span><input class="inp" id="f_ngayGio" value="${esc(d.ngayGio)}" placeholder="12/3"></label></div>
      <label class="fld"><span>Nơi an táng</span><input class="inp" id="f_anTang" value="${esc(d.anTang)}"></label></div>
    <details class="more-f"${d.ngaySinh || d.dienThoai || d.diaChi || d.ghiChu || d.tenHuy || d.nguon ? ' open' : ''}><summary>Thêm chi tiết</summary>
      <label class="fld"><span>Ngày sinh đầy đủ (dương lịch)</span><input class="inp" id="f_ngaySinh" value="${esc(d.ngaySinh)}" placeholder="15/08/1985"></label>
      <label class="fld"><span>Tên húy, tên chữ</span><input class="inp" id="f_tenHuy" value="${esc(d.tenHuy)}"></label>
      <label class="fld"><span>Điện thoại</span><input class="inp" id="f_dienThoai" inputmode="tel" value="${esc(d.dienThoai)}"></label>
      <label class="fld"><span>Địa chỉ</span><input class="inp" id="f_diaChi" value="${esc(d.diaChi)}"></label>
      <label class="fld"><span>Ghi chú, tiểu sử ngắn</span><textarea class="inp" id="f_ghiChu">${esc(d.ghiChu)}</textarea></label>
      <label class="fld"><span>Nguồn thông tin (bà con không thấy mục này)</span><input class="inp" id="f_nguon" value="${esc(d.nguon)}" placeholder="Gia phả giấy chi 2, lời ông Khoa kể"></label>
      ${isAdmin() ? `<label class="fld"><span>Chi</span><input class="inp" id="f_chi" value="${esc(d.chi)}" list="chis" placeholder="Chi 1"><datalist id="chis">${S.chis.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
        <div class="fld"><span>Là dâu hoặc rể (người ngoài họ)</span><div class="chips">${radio('nt', '0', 'Không', !d.ngoaiToc)}${radio('nt', '1', 'Có', d.ngoaiToc)}</div></div>` : ''}
    </details>
    <div class="acts">${mode === 'edit' && isAdmin() ? `<button type="button" class="btn dng" data-act="delp" style="margin-right:auto">${S.form.confirmDel ? 'Bấm lần nữa để xóa' : 'Xóa'}</button>` : ''}
      <button type="button" class="btn" data-act="close">Hủy</button><button class="btn pri" type="submit" id="f_save">Lưu</button></div></form>`;
}
function readForm(){
  const v = id => { const el = $('#' + id); return el ? el.value.trim() : null; };
  const r = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };
  const d = Object.assign({}, S.form.d);
  d.hoTen = ($('#f_kd') && $('#f_kd').checked) ? 'Khuyết danh' : v('f_hoTen'); d.gioiTinh = r('gt') || 'nam'; d.namSinh = v('f_namSinh'); d.thuTu = v('f_thuTu');
  d.conSong = r('cs') !== '0';
  ['namMat','ngayGio','anTang','ngaySinh','dienThoai','diaChi','ghiChu','tenHuy','nguon'].forEach(k => { const x = v('f_' + k); if (x !== null) d[k] = x; });
  if (d.conSong){ d.namMat = ''; d.ngayGio = ''; }
  if (isAdmin()){ if (v('f_chi') !== null) d.chi = v('f_chi'); const nt = r('nt'); if (nt) d.ngoaiToc = nt === '1'; }
  const o = $('#f_other'); if (o){ const base = P(S.form.of); d[base.gioiTinh === 'nu' ? 'chaId' : 'meId'] = o.value; }
  return d;
}
function checkForm(d){
  if (!d.hoTen) return 'Chưa nhập họ tên.';
  if (d.namSinh && !/^\d{3,4}$/.test(d.namSinh)) return 'Năm sinh chỉ gồm 4 chữ số, ví dụ 1985.';
  if (d.namSinh && num(d.namSinh) > NOW_Y) return 'Năm sinh lớn hơn năm hiện tại.';
  if (d.namMat && !/^\d{3,4}$/.test(d.namMat)) return 'Năm mất chỉ gồm 4 chữ số.';
  if (d.namSinh && d.namMat && num(d.namMat) < num(d.namSinh)) return 'Năm mất đang nhỏ hơn năm sinh.';
  if (d.ngayGio && !/^\s*\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*$/.test(d.ngayGio)) return 'Ngày giỗ ghi theo dạng ngày/tháng âm, ví dụ 12/3.';
  if (d.ngaySinh && !/^\s*\d{1,2}\s*[\/\-.]\s*\d{1,2}([\/\-.]\d{3,4})?\s*$/.test(d.ngaySinh)) return 'Ngày sinh ghi dạng ngày/tháng/năm, ví dụ 15/08/1985.';
  return '';
}
async function submitPerson(){
  const d = readForm(); const err = checkForm(d);
  S.form.d = d;
  if (err){ S.form.err = err; renderOverlay(); const e = $('.sheet'); if (e) e.scrollTop = 0; return; }
  const btn = $('#f_save'); btn.disabled = true; btn.textContent = 'Đang lưu…';
  try {
    const r = await api('save', { person: d }); const p = r.person;
    const isNew = !S.list.some(x => x.id === p.id);
    let arr = S.list.filter(x => x.id !== p.id).concat([Object.assign({}, P(p.id) || {}, p)]);
    if (p.voChong) p.voChong.split(',').forEach(sid => { const s = arr.find(x => x.id === sid); if (s){ const l = String(s.voChong || '').split(',').filter(Boolean); if (!l.includes(p.id)){ l.push(p.id); arr = arr.map(x => x.id === sid ? Object.assign({}, x, { voChong:l.join(',') }) : x); } } });
    reindex(arr);
    if (S.form.photo){ const ph = await api('uploadPhoto', { id:p.id, data:S.form.photo }); S.photos[ph.anhId] = S.form.photo; IDB.set(ph.anhId, S.form.photo); P(p.id).anhId = ph.anhId; }
    if (S.form.rel === 'cha'){ const child = Object.assign({}, P(S.form.of)); child[p.gioiTinh === 'nu' ? 'meId' : 'chaId'] = p.id;
      const r2 = await api('save', { person: child }); reindex(S.list.map(x => x.id === child.id ? Object.assign({}, x, r2.person) : x)); }
    if (S.form.rel === 'root') S.focus = p.id;
    const name = p.hoTen; S.overlay = null; S.form = null; renderOverlay(); render(true);
    toast(isNew ? 'Đã thêm ' + name : 'Đã lưu');
  } catch(e){ S.form.err = e.message; renderOverlay(); }
}

/* ---------- sự kiện ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'scrim'){ if (e.target === t && S.overlay !== 'form'){ S.overlay = null; renderOverlay(); } return; }
  switch (a){
    case 'fill': $('#lg_u').value = t.dataset.u; $('#lg_p').value = '123456'; break;
    case 'home': go('family'); break;
    case 'tab': go(t.dataset.v); break;
    case 'focus': S.overlay = null; S.form = null; renderOverlay(); go(S.view === 'tree' || S.view === 'time' ? S.view : 'family', id); if (S.view === 'family') scrollTo(0, 0); break;
    case 'tfocus': { const w = $('#twrap'); if (w && w.dataset.dragged) return;
      if (id === S.focus) go('family'); else { S.focus = id; store.set('gp_focus', id); render(); } break; }
    case 'lfocus': if (id === S.focus) go('family'); else { S.focus = id; store.set('gp_focus', id); render(true); } break;
    case 'tmode': S.treeMode = t.dataset.m; render(); break;
    case 'zoom': S.zoom = Math.min(1.6, Math.max(0.4, Math.round((treeZoom() + 0.2 * +t.dataset.z) * 10) / 10)); S.zoomUser = true; { const tr = $('#tree'); if (tr) tr.style.zoom = S.zoom; requestAnimationFrame(centerTree); } break;
    case 'center': centerTree(); break;
    case 'search': S.overlay = 'search'; renderOverlay(); break;
    case 'menu': S.overlay = 'menu'; renderOverlay(); break;
    case 'close': S.overlay = null; S.form = null; renderOverlay(); break;
    case 'view': S.overlay = null; renderOverlay(); if (t.dataset.v === 'admin'){ S.users = null; S.logs = null; } go(t.dataset.v); break;
    case 'pw': S.overlay = 'pw'; renderOverlay(); break;
    case 'logout': logout(); break;
    case 'zoomphoto': S.overlay = 'photo'; renderOverlay(); break;
    case 'edit': openForm('edit', null, id); break;
    case 'add': openForm('new', t.dataset.rel, id); break;
    case 'addroot': openForm('new', 'root', null); break;
    case 'delp': if (!S.form.confirmDel){ S.form.d = readForm(); S.form.confirmDel = true; renderOverlay(); break; }
      try { await api('delete', { id:S.form.d.id }); const del = S.form.d.id; reindex(S.list.filter(x => x.id !== del).map(x => Object.assign({}, x, { voChong:String(x.voChong || '').split(',').filter(i => i && i !== del).join(',') })));
        S.focus = defaultFocus(); S.overlay = null; S.form = null; renderOverlay(); render(); toast('Đã xóa'); }
      catch(er){ S.form.err = er.message; S.form.confirmDel = false; renderOverlay(); } break;
    case 'entry': try { const r = await api('setEntryMode', { on: !S.entryMode }); S.entryMode = r.entryMode; S.logs = null; render(true); loadAdmin(); toast(S.entryMode ? 'Đã mở nhập liệu' : 'Đã đóng nhập liệu. Chỉ còn quản trị sửa được.'); } catch(er){ toast(er.message); } break;
    case 'urole': { const u = S.users.find(x => x.tenDangNhap === t.dataset.u);
      try { const r = await api('saveUser', { user:{ tenDangNhap:u.tenDangNhap, vaiTro: u.vaiTro === 'bientap' ? 'xem' : 'bientap' } }); S.users = r.users; render(true); } catch(er){ toast(er.message); } break; }
    case 'ulock': { const u = S.users.find(x => x.tenDangNhap === t.dataset.u);
      try { const r = await api('saveUser', { user:{ tenDangNhap:u.tenDangNhap, vaiTro:u.vaiTro, khoa: !u.khoa } }); S.users = r.users; render(true); toast(u.khoa ? 'Đã mở khóa' : 'Đã khóa, máy kia bị đăng xuất'); } catch(er){ toast(er.message); } break; }
    case 'ureset': S.resetFor = S.resetFor === t.dataset.u ? null : t.dataset.u; render(true); { const i = $('#rs_pw'); if (i) i.focus(); } break;
    case 'calv': S.calView = t.dataset.v; S.calSel = null; render(); break;
    case 'calmore': S.calRange = Math.min(12, S.calRange + 3); render(true); break;
    case 'calnav': S.calM += +t.dataset.z; if (S.calM < 1){ S.calM = 12; S.calY--; } if (S.calM > 12){ S.calM = 1; S.calY++; } S.calSel = null; render(true); break;
    case 'calday': { const d = +t.dataset.d; S.calSel = S.calSel === d ? null : d; render(true); break; }
    case 'hadd': S.hform = { item:{ id:'', loai:t.dataset.l, thoiGian:'', tieuDe:'', noiDung:'', thuTu:'' }, err:'', confirmDel:false }; S.overlay = 'hist'; renderOverlay(); break;
    case 'hedit': { const x = S.hist.find(h => h.id === id); if (!x) break; S.hform = { item:Object.assign({}, x), err:'', confirmDel:false }; S.overlay = 'hist'; renderOverlay(); break; }
    case 'hdel': if (!S.hform.confirmDel){ S.hform.item = readHist(); S.hform.confirmDel = true; renderOverlay(); break; }
      try { await api('delHist', { id:S.hform.item.id }); S.hist = S.hist.filter(h => h.id !== S.hform.item.id); S.overlay = null; S.hform = null; renderOverlay(); render(true); toast('Đã xóa'); }
      catch(er){ S.hform.err = er.message; S.hform.confirmDel = false; renderOverlay(); } break;
    case 'optsn': try { const r = await api('setOption', { key:'sinhNhat', on: !S.opts.sinhNhat }); S.opts = r.options; render(true); toast(S.opts.sinhNhat ? 'Bà con sẽ thấy sinh nhật trong tab Lịch' : 'Đã ẩn sinh nhật với bà con'); } catch(er){ toast(er.message); } break;
    case 'gedcom': saveFile('gia-pha-' + new Date().toISOString().slice(0, 10) + '.ged', gedcom()); break;
    case 'printtree': S.view = 'tree'; S.treeMode = 'toan'; S.zoomUser = true; S.zoom = 0.7; render(); setTimeout(() => { try { window.print(); } catch(er){} }, 500); break;
    case 'resetdemo': DB = demoSeed(); demoSave(); S.users = null; S.logs = null; S.photos = {}; S.asked = {}; S.focus = 'p5'; await loadData(); toast('Đã khôi phục dữ liệu mẫu'); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ $('#qres').innerHTML = searchRes(e.target.value); setTimeout(loadPhotos, 30); } });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'cs'){ const box = $('#deadF'); if (box) box.hidden = t.value === '1'; }
  if (t.id === 'f_kd'){ const n = $('#f_hoTen'); n.disabled = t.checked; if (t.checked) n.value = ''; }
  if (t.matches('[data-photo]') && t.files && t.files[0]){
    try { S.form.photo = await readPhoto(t.files[0]); $('#pv').innerHTML = `<img src="${S.form.photo}" alt="">`; } catch(er){ toast(er.message); }
    t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.overlay){ S.overlay = null; S.form = null; renderOverlay(); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'login'){
    const b = $('#lg_b'); b.disabled = true; b.textContent = 'Đang đăng nhập…'; $('#lerr').innerHTML = '';
    try { const r = await api('login', { u:$('#lg_u').value, p:$('#lg_p').value }); S.token = r.token; S.me = r.me; store.set('gp_token', r.token);
      S.view = isPhone() ? (isLand() ? 'tree' : 'family') : 'tree'; S.treeMode = isPhone() ? 'quanh' : 'toan'; await loadData(); }
    catch(er){ $('#lerr').innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; b.textContent = 'Đăng nhập'; }
  }
  if (kind === 'person') submitPerson();
  if (kind === 'hist'){ const x = readHist(); S.hform.item = x;
    if (!x.tieuDe){ S.hform.err = 'Chưa nhập tiêu đề.'; renderOverlay(); return; }
    try { const r = await api('saveHist', { item:x }); S.hist = S.hist.filter(h => h.id !== r.item.id).concat([r.item]); S.overlay = null; S.hform = null; renderOverlay(); render(true); toast('Đã lưu'); }
    catch(er){ S.hform.err = er.message; renderOverlay(); } }
  if (kind === 'pw'){ try { const r = await api('changePassword', { old:$('#pw_o').value, new:$('#pw_n').value }); S.token = r.token; store.set('gp_token', r.token); S.overlay = null; renderOverlay(); toast('Đã đổi mật khẩu'); }
    catch(er){ $('#ferr').innerHTML = `<div class="err">${esc(er.message)}</div>`; } }
  if (kind === 'reset'){ const pw = $('#rs_pw').value.trim(); if (pw.length < 6){ toast('Mật khẩu tối thiểu 6 ký tự'); return; }
    const u = S.users.find(x => x.tenDangNhap === f.dataset.u);
    try { const r = await api('saveUser', { user:{ tenDangNhap:u.tenDangNhap, vaiTro:u.vaiTro, matKhau:pw } }); S.users = r.users; S.resetFor = null; render(true); toast('Đã đặt lại mật khẩu cho ' + u.tenDangNhap); } catch(er){ toast(er.message); } }
  if (kind === 'newuser'){
    const user = { tenDangNhap:$('#nu_u').value, hoTen:$('#nu_n').value.trim(), chi:$('#nu_c').value, vaiTro:$('#nu_r').value, matKhau:$('#nu_p').value.trim() };
    try { const r = await api('saveUser', { user }); S.users = r.users; S.logs = null; render(true); loadAdmin(); toast('Đã tạo tài khoản ' + user.tenDangNhap.trim().toLowerCase()); } catch(er){ toast(er.message); } }
});

/* ---------- khởi động ---------- */
(async function start(){
  await IDB.open();
  S.token = store.get('gp_token');
  if (!S.token){ render(); return; }
  S.view = isPhone() ? (isLand() ? 'tree' : 'family') : 'tree'; S.treeMode = isPhone() ? 'quanh' : 'toan';
  if (!DEMO){ const cached = store.get('gp_data'); if (cached){ applyData(cached); render(); } }
  await loadData();
})();
if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
